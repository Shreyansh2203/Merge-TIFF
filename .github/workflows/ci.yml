name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Lint Python
        run: python -m ruff check .
      # The coverage gate lives in pytest.ini addopts, so this step is the gate
      # as well as the report: `--cov-fail-under` fails the step, and the
      # term-missing table in the log is where the number is read.
      - name: Run pytest with the coverage gate
        run: python -m pytest

  frontend:
    name: Next.js lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit high and critical advisories
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Run client unit tests
        run: npm run test:ui
      # Coverage thresholds (lines, branches, functions) are on the script, so
      # this step fails the build on a drop as well as printing the table.
      - name: Run client unit tests with the coverage gate
        run: npm run test:ui:coverage
      - name: Build
        run: npm run build
