repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the ruff version resolved in uv.lock, so the hook and CI
    # enforce the same formatting rules.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
